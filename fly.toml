# Конфигурация Fly.io: https://fly.io/docs/reference/configuration/
#
# ВАЖНО: этот файл правится только вручную в репозитории.
# Изменения через раздел Scaling в дашборде Fly перезаписывают его
# (интеграция создаёт PR) и включают auto-stop — комнаты начинают «умирать».

app = 'scrum-poker-kimi'
primary_region = 'ams'   # регион машины; ближайшие к РФ альтернативы: waw, fra

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 4000   # порт приложения (ENV PORT в Dockerfile)
  force_https = true
  # Критично для приложения с состоянием в памяти и WebSocket:
  # не останавливать машину при «простое» и держать одну машину включённой,
  # иначе соединения рвутся, а комнаты и токены теряются.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

# Строго одна машина: состояние комнат в памяти, масштабирование недопустимо
# (контроль: fly scale count 1).
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
